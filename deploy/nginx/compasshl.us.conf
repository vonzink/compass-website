server {
    listen 80;
    listen [::]:80;
    server_name compasshl.us www.compasshl.us;

    return 301 https://compasshl.us$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name compasshl.us;

    ssl_certificate /etc/letsencrypt/live/compasshl.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compasshl.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.compasshl.us;

    ssl_certificate /etc/letsencrypt/live/compasshl.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compasshl.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://compasshl.us$request_uri;
}
